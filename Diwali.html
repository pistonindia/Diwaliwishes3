
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Diwali</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #5b160b, #e87509, #ffc857);
    }
    .card {
      padding: 40px 25px;
      margin: 20px;
      border: 2px solid #ffd76a;
      border-radius: 20px;
      background: rgba(80, 20, 0, 0.45);
      box-shadow: 0 0 30px #ffb52e;
    }
    h1 { color: #ffe58a; font-size: 42px; }
    p { font-size: 19px; line-height: 1.7; }
    .diya { font-size: 65px; }
    button {
      padding: 12px 22px;
      border: none;
      border-radius: 25px;
      background: #ffe58a;
      color: #7a2100;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="diya">🪔✨🪔</div>
    <h1>Happy Diwali!</h1>
    <p>May the festival of lights bring you<br>
       happiness, prosperity, good health,<br>
       and success throughout the year.</p>
    <h2>Wishing You and Your Family a Joyful Diwali!</h2>
    <button onclick="alert('Happy Diwali! 🪔')">
      Send Best Wishes
    </button>
  </div>
</body>
</html>
